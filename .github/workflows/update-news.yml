name: 뉴스 자동 수집·정리

on:
  schedule:
    - cron: "40 21 * * *"   # 매일 06:40 KST
    - cron: "40 8 * * *"    # 매일 17:40 KST
  workflow_dispatch:
    inputs:
      days:
        description: "최근 며칠치 기사를 수집할지(최대 30)"
        required: false
        default: "3"
  push:
    branches: [main]
    paths:
      - "data/db/**"
      - "data/sources.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집 (예약·수동 실행, 코드·수집원 변경 시)
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, '데이터 관리')
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          D2B_API_KEY: ${{ secrets.D2B_API_KEY }}
          D2B_OPS: ${{ vars.D2B_OPS }}
        run: python scripts/collect.py --days "${{ github.event.inputs.days || (github.event_name == 'push' && '30') || '3' }}"
      - name: 일·주·월·연 정리
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python scripts/build.py
      - name: 변경 커밋
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "뉴스 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
